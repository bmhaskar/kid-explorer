name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: hermetic suite (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22.6', '24', '26']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: suites
        run: ./test/run-all.sh

      # The suite must not lean on anything a developer happens to have in ~/.pi.
      # This step is what catches that class of bug: a clean machine has no ~/.pi at
      # all, and a find on a missing path used to abort the whole run under pipefail.
      - name: suites, from a pristine HOME
        env:
          HOME: ${{ runner.temp }}/ci-home
        run: |-
          rm -rf "$HOME"
          mkdir -p "$HOME"
          test ! -d "$HOME/.pi" || { echo "expected no ~/.pi in a pristine home" >&2; exit 1; }
          ./test/run-all.sh

      # --strict is for a workstation that has pi installed, where the
      # optional live suite can actually run. In CI there is no pi binary, so that
      # suite reports a skip, which is honest and not a failure.

  container:
    name: hermetic suite in a container, offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build and run with --network none
        run: ./test/docker-test.sh --per-suite --repeat 2
